<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: ana ekrana eklenince adres çubuğu kalkar, kendi ikonu ve adıyla
         açılır. theme-color seçili temayı izler (ThemeContext yazar); buradaki
         değer ilk kare içindir. apple-touch-icon iOS'un manifest ikonunu
         okumaması için ayrıca verilir. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#08080f" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamTR" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://image.tmdb.org https://secure.gravatar.com https://lh3.googleusercontent.com; connect-src 'self' https://api.themoviedb.org https://www.youtube.com https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- Yazı tipleri kendi sunucudan gelir (bkz. src/main.jsx); Google Fonts
         bağlantısı ve preconnect'leri kaldırıldı — render'ı bloklayan tek
         üçüncü taraf istek oydu. -->
    <!-- Vitrin görseli (LCP) TMDB'den gelir; görsel ve veri bağlantıları JS
         yüklenmeden kurulsun. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <!-- Erken veri betiği (src/erken.js) buraya ELLE yazılmaz: Vite aynı
         HTML'deki modül betiklerini tek girişte birleştirir. vite.erken.js
         eklentisi onu ayrı giriş yapar ve <head> başına ekler. -->
    <title>StreamTR – Türkiye'nin En İyi İçerikleri</title>
    <meta name="description" content="Netflix, Prime Video, Disney+, Apple TV+ Türkiye'deki en iyi dizi ve filmler. IMDB, Rotten Tomatoes ve sosyal medya verisiyle." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
