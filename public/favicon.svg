<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Katmanlı Sinyal, varsayılan tema (Neon Siber) renklerinde. Geometri
       BrandMark.jsx ile aynı (64'lük kutu, ölçeklenmiş). Favicon boyunda
       görünmeyen gren ve ışıma bilinçli olarak yok; katmanlar, parlak üst yüz
       ve dalgalar kaldı. Koyu karo açık sekme çubuğunda da okunsun diye. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc8a"/>
      <stop offset="1" stop-color="#00aee0"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="14" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="t" d="M14 17.5v29a3 3 0 0 0 4.5 2.6l24.6-14.5a3 3 0 0 0 0-5.2L18.5 14.9A3 3 0 0 0 14 17.5z"/>
  </defs>
  <rect width="32" height="32" rx="7" fill="#08080f"/>
  <g transform="translate(16 16) scale(0.5) translate(-30.8 -32)">
    <g transform="translate(-2.5 0)">
      <use href="#t" transform="translate(-7 0)" fill="url(#g)" opacity="0.25"/>
      <use href="#t" transform="translate(-3.5 0)" fill="url(#g)" opacity="0.5"/>
      <use href="#t" fill="url(#g)"/>
      <use href="#t" fill="url(#gl)" opacity="0.55"/>
      <path d="M48.5 24.5a10.5 10.5 0 0 1 0 15" stroke="url(#g)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M54 19a18 18 0 0 1 0 26" stroke="url(#g)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>
  </g>
</svg>
